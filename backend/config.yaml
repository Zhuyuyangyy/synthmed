# 多模态手语翻译系统配置

project:
  name: "多模态手语翻译系统"
  version: "1.0.0"
  description: "基于视觉与生成式AI的双向手语实时翻译系统"

server:
  host: "0.0.0.0"
  port: 8000
  debug: true

# MediaPipe配置
mediapipe:
  max_hands: 2
  max_faces: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

# 三通道Transformer融合配置
fusion:
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.1

# 手语识别配置
recognition:
  batch_size: 8
  sequence_length: 30  # 帧数
  csl_accuracy: 0.963  # CSL准确率96.3%

# 手语视频生成配置
generation:
  model: "stable-diffusion"
  fps: 25
  video_length: 50
  resolution: [512, 512]

# WebRTC配置
webrtc:
  enabled: true
  port: 8080
  buffer_size: 30
  latency_target: 1.5  # 秒

# CORS
cors:
  origins:
    - "*"
